name: obdata-polymarket

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-100m}

# Polymarket orderbook stack — obdata-side, full pipeline.
#
#   obdata-polymarket-collector
#     Owns Gamma market discovery and the restart cache, subscribes to the
#     Polymarket WS, and publishes v3 records to `polymarket:events:v3`.
#
#   obdata-polymarket-clickhouse-writer
#     Consumes `polymarket:events:v3` and acknowledges records only after
#     ClickHouse commits them to `polymarket_orderbook_v3`.
#
#   obdata-polymarket-archive-exporter
#     Reads obdata-clickhouse `polymarket_orderbook_v3` and exports one
#     market-clustered Parquet file per event type and UTC hour.
#
# All services join the private `obdata` bridge created by the infrastructure
# Compose project. Redis and ClickHouse are addressed by service name and do
# not publish ports to the host.

services:

  obdata-polymarket-collector:
    build:
      context: .
      dockerfile: services/polymarket/collector/Dockerfile
    container_name: obdata-polymarket-collector
    command: ["/app/polymarket-collector"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    logging: *default-logging
    networks:
      - obdata
    ulimits:
      nofile:
        soft: ${CONTAINER_NOFILE_LIMIT:-65536}
        hard: ${CONTAINER_NOFILE_LIMIT:-65536}
    environment:
      REDIS_URL: redis://obdata-redis:6379
      REDIS_KEY_ACTIVE_MARKETS: polymarket:active_markets
      # Durable event log consumed and acknowledged by the ClickHouse writer.
      REDIS_EVENT_STREAM: polymarket:events:v3
      # Exactly one authoritative collector may hold this renewable lease.
      # Every stream append is atomically fenced by the current lease token.
      PUBLISHER_LEASE_KEY: polymarket:publisher:v3:lease
      PUBLISHER_LEASE_GENERATION_KEY: polymarket:publisher:v3:generation
      # The collector recovers its sequence-generation floor from ClickHouse
      # before acquiring the lease, then fsyncs the new value to Redis AOF.
      PUBLISHER_GENERATION_PERSIST_TIMEOUT_MS: "5000"
      PUBLISHER_LEASE_TTL_MS: "15000"
      PUBLISHER_LEASE_RENEW_MS: "5000"
      CLICKHOUSE_HOST: obdata-clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_TABLE: polymarket_orderbook_v3
      # WS pool
      QUEUE_SIZE: "1000000"
      LIFECYCLE_QUEUE_SIZE: "8192"
      MAX_ASSETS_PER_CONN: "250"
      # Redis Stream publication batching
      MAX_BATCH: "200"
      LINGER_MS: "2"
      RUST_LOG: info

  obdata-polymarket-clickhouse-writer:
    build:
      context: .
      dockerfile: services/polymarket/clickhouse-writer/Dockerfile
    container_name: obdata-polymarket-clickhouse-writer
    command: ["/app/polymarket-clickhouse-writer"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - obdata
    ulimits:
      nofile:
        soft: ${CONTAINER_NOFILE_LIMIT:-65536}
        hard: ${CONTAINER_NOFILE_LIMIT:-65536}
    environment:
      # Same durable stream as the collector.
      REDIS_URL: redis://obdata-redis:6379
      REDIS_EVENT_STREAM: polymarket:events:v3
      EVENT_CONSUMER_GROUP: polymarket-clickhouse-v3
      # Keep this stable across restarts so this consumer drains its pending entries.
      EVENT_CONSUMER_NAME: polymarket-clickhouse-v3-1
      STREAM_RECONNECT_DELAY_MS: "2000"
      CLICKHOUSE_HOST: obdata-clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_TABLE: polymarket_orderbook_v3
      FLUSH_BATCH_SIZE: "5000"
      FLUSH_INTERVAL_MS: "500"
      RUST_LOG: info

  obdata-polymarket-archive-exporter:
    build:
      context: .
      dockerfile: services/polymarket/archive-exporter/Dockerfile
    container_name: obdata-polymarket-archive-exporter
    command: ["/app/polymarket-archive-exporter"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    logging: *default-logging
    networks:
      - obdata
    environment:
      CLICKHOUSE_HOST: obdata-clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_TABLE: polymarket_orderbook_v3
      CLICKHOUSE_RETENTION_HOURS: ${CLICKHOUSE_RETENTION_HOURS:-3}
      EXPORT_BACKEND: ${EXPORT_BACKEND:-r2}
      LOCAL_EXPORT_DIR: ${LOCAL_EXPORT_DIR:-/exports}
      EXPORT_ONCE: ${EXPORT_ONCE:-false}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      RUST_LOG: info

networks:
  obdata:
    external: true
    name: obdata
