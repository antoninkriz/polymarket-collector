name: obdata-polymarket

# Polymarket orderbook stack — obdata-side, full pipeline.
#
#   obdata-polymarket-active-markets
#     Polls the Polymarket Gamma REST API, maintains the Redis active_markets
#     cache and lifecycle event stream that the pubsub publisher consumes.
#
#   obdata-polymarket-orderbook-rust-pubsub
#     Subscribes to the Polymarket WS and publishes all standard and custom
#     market event variants as v3 records on durable Redis Stream
#     `polymarket:events:v3`. Only service holding a Polymarket WS connection.
#
#   obdata-polymarket-orderbook-rust-from-pubsub
#     Consumes `polymarket:events:v3` and acknowledges records only after
#     ClickHouse commits them to `polymarket_orderbook_v3`.
#
#   obdata-polymarket-r2-archive-exporter
#     Reads obdata-clickhouse `polymarket_orderbook_v3` and exports hourly
#     replay-ordered Parquet snapshots.
#
# All services use `network_mode: host` so they reach the host-local
# Redis (localhost:6380) and ClickHouse (localhost:8124).

services:

  obdata-polymarket-active-markets:
    build:
      context: .
      dockerfile: services/polymarket/polymarket-active-markets/Dockerfile
    container_name: obdata-polymarket-active-markets
    command: ["python", "run.py"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    network_mode: host
    environment:
      REDIS_URL: redis://localhost:6380
      REDIS_STREAM_MARKET_EVENTS: polymarket:market_events
      REDIS_KEY_ACTIVE_MARKETS: polymarket:active_markets
      REDIS_KEY_ACTIVE_MARKETS_COUNT: polymarket:active_markets:count

  obdata-polymarket-orderbook-rust-pubsub:
    build:
      context: .
      dockerfile: services/polymarket/polymarket-orderbook-rust-pubsub/Dockerfile
    container_name: obdata-polymarket-orderbook-rust-pubsub
    # Optional flags: --new-only (skip pre-loading active markets),
    #                 --skip-backlog (skip unprocessed Redis stream messages)
    command: ["/app/polymarket-orderbook-rust-pubsub"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    network_mode: host
    depends_on:
      - obdata-polymarket-active-markets
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # Redis (host-local)
      REDIS_URL: redis://localhost:6380
      REDIS_STREAM_MARKET_EVENTS: polymarket:market_events
      REDIS_KEY_ACTIVE_MARKETS: polymarket:active_markets
      REDIS_KEY_ACTIVE_MARKETS_COUNT: polymarket:active_markets:count
      # Durable event log consumed and acknowledged by the ClickHouse writer.
      REDIS_EVENT_STREAM: polymarket:events:v3
      # Exactly one authoritative publisher may hold this renewable lease.
      # Every stream append is atomically fenced by the current lease token.
      PUBLISHER_LEASE_KEY: polymarket:publisher:v3:lease
      PUBLISHER_LEASE_GENERATION_KEY: polymarket:publisher:v3:generation
      PUBLISHER_LEASE_TTL_MS: "15000"
      PUBLISHER_LEASE_RENEW_MS: "5000"
      # WS pool
      SKIP_ACTIVE_MARKETS_CACHE: "false"
      QUEUE_SIZE: "5000000"
      MAX_ASSETS_PER_CONN: "500"
      # Redis Stream publisher batching
      MAX_BATCH: "200"
      LINGER_MS: "2"
      # Independent consumer group from the from-pubsub side
      ORDERBOOK_CONSUMER_GROUP: polymarket-orderbook-pubsub
      ORDERBOOK_CONSUMER_NAME: polymarket-orderbook-pubsub-1
      RUST_LOG: info,polymarket_orderbook_rust_pubsub=info,polymarket_orderbook_rust=info

  obdata-polymarket-orderbook-rust-from-pubsub:
    build:
      context: .
      dockerfile: services/polymarket/polymarket-orderbook-rust-from-pubsub/Dockerfile
    container_name: obdata-polymarket-orderbook-rust-from-pubsub
    command: ["/app/polymarket-orderbook-rust-from-pubsub"]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    network_mode: host
    depends_on:
      - obdata-polymarket-orderbook-rust-pubsub
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # Redis (host-local) — same durable stream as the publisher
      REDIS_URL: redis://localhost:6380
      REDIS_EVENT_STREAM: polymarket:events:v3
      EVENT_CONSUMER_GROUP: polymarket-clickhouse-v3
      # Keep this stable across restarts so this consumer drains its pending entries.
      EVENT_CONSUMER_NAME: polymarket-clickhouse-v3-1
      # Safe only because this deployment owns the stream's sole consumer group.
      # The atomic cleanup refuses to delete if another group is ever added.
      DELETE_ACKED_STREAM_ENTRIES: "true"
      STREAM_RECONNECT_DELAY_MS: "2000"
      # ClickHouse (host-local)
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8124"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_TABLE: polymarket_orderbook_v3
      FLUSH_BATCH_SIZE: "5000"
      FLUSH_INTERVAL_MS: "500"
      QUEUE_SIZE: "5000000"
      RUST_LOG: info,polymarket_orderbook_rust_from_pubsub=info,polymarket_orderbook_rust=info

  obdata-polymarket-r2-archive-exporter:
    build:
      context: .
      dockerfile: services/r2-archive/exporter/Dockerfile
    container_name: obdata-polymarket-r2-archive-exporter
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    network_mode: host
    environment:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8124"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_TABLE: polymarket_orderbook_v3
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
