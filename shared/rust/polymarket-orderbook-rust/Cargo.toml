[package]
name = "polymarket-orderbook-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Polymarket orderbook library: WS connection pool, REST client, ClickHouse sink, and shared event types used by the polymarket-orderbook-rust-pubsub and polymarket-orderbook-rust-from-pubsub binaries"

[lib]
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# HTTP client (used for both ClickHouse inserts and Gamma API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# Redis (cache + streams)
redis = { version = "0.27", features = ["tokio-comp", "streams"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }

# Logging / tracing
tracing = "0.1"

# Errors
anyhow = "1"

# Misc
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
