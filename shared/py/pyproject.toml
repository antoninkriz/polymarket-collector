[project]
name = "obdata"
version = "0.1.0"
description = "Shared library for orderbook data services"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
