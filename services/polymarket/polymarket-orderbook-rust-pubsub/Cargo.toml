[package]
name = "polymarket-orderbook-rust-pubsub"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Polymarket orderbook → Redis pub/sub publisher"

[[bin]]
name = "polymarket-orderbook-rust-pubsub"
path = "src/main.rs"

[dependencies]
polymarket-orderbook-rust = { path = "../../../shared/rust/polymarket-orderbook-rust" }

tokio = { version = "1.42", features = ["full"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
