[package]
name = "polymarket-orderbook-rust-pubsub"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Polymarket orderbook → fenced Redis Stream publisher"

[[bin]]
name = "polymarket-orderbook-rust-pubsub"
path = "src/main.rs"

[dependencies]
polymarket-orderbook-rust = { path = "../../../shared/rust/polymarket-orderbook-rust" }

tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
redis = { version = "1.5.0", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["gzip", "json", "query", "rustls"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
dotenvy = "0.15.7"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json"] }
anyhow = "1.0.104"
uuid = { version = "1.24.0", default-features = false, features = ["std", "v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
