[package]
name = "polymarket-orderbook-rust-pubsub"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Polymarket orderbook → fenced Redis Stream publisher"

[[bin]]
name = "polymarket-orderbook-rust-pubsub"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
redis = { version = "1.5.0", default-features = false, features = ["connection-manager", "script", "tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["gzip", "http2", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rust_decimal = { version = "1.42.1", default-features = false, features = ["serde-with-str", "std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json"] }
anyhow = "1.0.104"
uuid = { version = "1.24.0", default-features = false, features = ["std", "v4"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
