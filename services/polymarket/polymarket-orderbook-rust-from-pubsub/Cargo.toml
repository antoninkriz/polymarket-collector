[package]
name = "polymarket-orderbook-rust-from-pubsub"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Polymarket orderbook → ClickHouse writer fed from Redis pub/sub"

[[bin]]
name = "polymarket-orderbook-rust-from-pubsub"
path = "src/main.rs"

[dependencies]
polymarket-orderbook-rust = { path = "../../../shared/rust/polymarket-orderbook-rust" }

tokio = { version = "1.42", features = ["full"] }
redis = { version = "0.27", features = ["tokio-comp"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
