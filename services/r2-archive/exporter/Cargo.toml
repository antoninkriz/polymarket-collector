[package]
name = "polymarket-r2-archive-exporter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Streaming Polymarket v3 ClickHouse to Parquet exporter"

[[bin]]
name = "polymarket-r2-archive-exporter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arrow-array = "58.4.0"
arrow-cast = "58.4.0"
arrow-ipc = "58.4.0"
arrow-schema = "58.4.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
parquet = { version = "58.4.0", default-features = false, features = ["arrow", "simdutf8", "zstd"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "http2", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
