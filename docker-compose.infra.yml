name: obdata-infra

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-100m}

services:

  obdata-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.7.3.19
    container_name: obdata-clickhouse
    restart: unless-stopped
    logging: *default-logging
    networks:
      - obdata
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    volumes:
      - .data/clickhouse-data/lib:/var/lib/clickhouse
      - .data/clickhouse-data/log:/var/log/clickhouse-server
      - ./config/clickhouse/metric-log.xml:/etc/clickhouse-server/config.d/metric-log.xml:ro
    ulimits:
      nofile:
        soft: ${CONTAINER_NOFILE_LIMIT:-262144}
        hard: ${CONTAINER_NOFILE_LIMIT:-262144}

  obdata-redis:
    image: docker.io/library/redis:8.10.0-trixie
    container_name: obdata-redis
    restart: unless-stopped
    logging: *default-logging
    networks:
      - obdata
    volumes:
      - .data/redis-data:/data
    # AOF preserves the durable handoff across restarts. The stream is written
    # at very high volume but normally contains only a small unacknowledged
    # tail, so Redis's 64 MiB default would rewrite the AOF every few seconds.
    # A 4 GiB floor keeps recovery bounded but still permits rewrites every few
    # minutes at current traffic; monitor the cadence before increasing it,
    # because a larger AOF also lengthens restart recovery.
    # Periodic RDB snapshots are redundant with AOF and would add another fork
    # every minute under this workload.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 4gb
      - --save
      - ""

networks:
  obdata:
    # Application containers join this bridge by name from their own Compose
    # project. No database port is published to the host.
    name: obdata
