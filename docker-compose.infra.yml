name: obdata-infra

services:

  dozzle:
    image: docker.io/amir20/dozzle:v10.7.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_BASE=/

  obdata-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.7.3.19
    container_name: obdata-clickhouse
    restart: unless-stopped
    networks:
      - obdata
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    volumes:
      - .data/clickhouse-data/lib:/var/lib/clickhouse
      - .data/clickhouse-data/log:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: ${CONTAINER_NOFILE_LIMIT:-262144}
        hard: ${CONTAINER_NOFILE_LIMIT:-262144}

  obdata-redis:
    image: docker.io/library/redis:8.10.0-trixie
    container_name: obdata-redis
    restart: unless-stopped
    networks:
      - obdata
    volumes:
      - .data/redis-data:/data
    command: redis-server --appendonly yes

networks:
  obdata:
    # Application containers join this bridge by name from their own Compose
    # project. No database port is published to the host.
    name: obdata
